<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3d36"/>
      <stop offset="1" stop-color="#06201c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#25d366" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#25d366" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="720" height="352" fill="url(#bg)"/>
  <rect width="720" height="352" fill="url(#dots)"/>
  <rect width="720" height="352" fill="url(#glow)"/>

  <!-- chat bubbles -->
  <g transform="translate(500,70)">
    <rect x="0" y="0" width="170" height="60" rx="16" fill="#1f2c33"/>
    <path d="M14 60 L6 76 L30 60 Z" fill="#1f2c33"/>
    <rect x="18" y="18" width="110" height="9" rx="4.5" fill="#8696a0"/>
    <rect x="18" y="34" width="70" height="9" rx="4.5" fill="#8696a0" fill-opacity="0.6"/>
    <rect x="30" y="94" width="160" height="60" rx="16" fill="#25d366"/>
    <path d="M176 154 L186 170 L160 154 Z" fill="#25d366"/>
    <rect x="48" y="112" width="104" height="9" rx="4.5" fill="#06201c" fill-opacity="0.7"/>
    <rect x="48" y="128" width="64" height="9" rx="4.5" fill="#06201c" fill-opacity="0.45"/>
    <g transform="translate(0,188)">
      <rect x="0" y="0" width="86" height="40" rx="14" fill="#1f2c33"/>
      <circle cx="26" cy="20" r="5" fill="#8696a0"/>
      <circle cx="43" cy="20" r="5" fill="#8696a0" fill-opacity="0.7"/>
      <circle cx="60" cy="20" r="5" fill="#8696a0" fill-opacity="0.4"/>
    </g>
  </g>

  <g font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
    <text x="48" y="78" font-size="15" font-weight="600" fill="#25d366" letter-spacing="3">BOT LIBRARY</text>
    <text x="48" y="138" font-size="44" font-weight="800" fill="#ffffff">WhatsApp Bot</text>
    <text x="48" y="186" font-size="44" font-weight="800" fill="#25d366">for Flutter</text>
    <text x="48" y="226" font-size="18" fill="#c9d6d3">Automate WhatsApp from Dart &amp; Flutter apps</text>
    <g font-size="14" font-weight="600">
      <rect x="48" y="258" width="78" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#25d366" stroke-opacity="0.5"/>
      <text x="87" y="278" text-anchor="middle" fill="#e6f5f0">Flutter</text>
      <rect x="136" y="258" width="62" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#25d366" stroke-opacity="0.5"/>
      <text x="167" y="278" text-anchor="middle" fill="#e6f5f0">Dart</text>
      <rect x="208" y="258" width="100" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#25d366" stroke-opacity="0.5"/>
      <text x="258" y="278" text-anchor="middle" fill="#e6f5f0">Puppeteer</text>
    </g>
  </g>
