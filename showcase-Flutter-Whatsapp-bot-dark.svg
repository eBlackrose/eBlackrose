<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="816" height="216" viewBox="0 0 816 216" role="img" aria-label="Flutter-Whatsapp-bot">
  <style>
    .cell {
      animation: cell-in 420ms cubic-bezier(0.16, 1, 0.3, 1) backwards;
      transform-origin: center;
      transform-box: fill-box;
    }
    @keyframes cell-in {
      from { opacity: 0; transform: scale(0.2); }
      to   { opacity: 1; transform: scale(1); }
    }
    .cell.active {
      animation: cell-in 420ms cubic-bezier(0.16, 1, 0.3, 1) backwards,
                 wave 1.5s ease-in-out infinite;
    }
    @keyframes wave {
      0%, 100% { filter: brightness(1) drop-shadow(0 0 0 transparent); }
      4%       { filter: brightness(2.1) drop-shadow(0 0 4px currentColor); }
      12%      { filter: brightness(1) drop-shadow(0 0 0 transparent); }
    }
    .fade-in {
      animation: fade-in 520ms ease-out backwards;
    }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    text.fade-in, image.fade-in, g.fade-in {
      transform-box: fill-box;
    }
  </style>
  <rect width="816" height="216" fill="#0d1117" />
  <g transform="translate(8, 8)">
    <a href="https://github.com/eBlackrose/Flutter-Whatsapp-bot" target="_blank">
    <g transform="translate(0, 0)">
      <defs><clipPath id="og-0-d"><rect x="12" y="12" width="360" height="176" rx="6" ry="6" /></clipPath></defs>
    <image class="fade-in" style="animation-delay:0ms" x="12" y="12" width="360" height="176" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid slice" clip-path="url(#og-0-d)" />
      <text class="fade-in" style="animation-delay:80ms" x="390" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#58a6ff">Flutter-Whatsapp-bot</text>
      <text class="fade-in" style="animation-delay:160ms" x="786" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e3b341" text-anchor="end">★ 22</text>
      <text class="fade-in" style="animation-delay:140ms" x="390" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8d96a0">Flutter &amp; Dart WhatsApp bot · based on whatsapp_bot_flutter</text>
      <text x="390" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#8d96a0">no commits in last 52 weeks</text>
      <text class="fade-in" style="animation-delay:1000ms" x="390" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8d96a0">0 commits / 52w · pushed 1y ago</text>
      <text class="fade-in" style="animation-delay:1100ms" x="390" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8d96a0" font-style="italic">No recent activity</text>
    </g>
  </a>
  </g>
</svg>
