<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1a24"/>
      <stop offset="1" stop-color="#070b12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10a37f" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#10a37f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="720" height="352" fill="url(#bg)"/>
  <rect width="720" height="352" fill="url(#glow)"/>

  <!-- react orbit -->
  <g transform="translate(580,176)" fill="none" stroke="#61dafb" stroke-opacity="0.25" stroke-width="2">
    <ellipse rx="130" ry="48"/>
    <ellipse rx="130" ry="48" transform="rotate(60)"/>
    <ellipse rx="130" ry="48" transform="rotate(120)"/>
  </g>
  <!-- phone -->
  <g transform="translate(528,62)">
    <rect width="104" height="228" rx="18" fill="#111b26" stroke="#2c3e50" stroke-width="3"/>
    <rect x="38" y="10" width="28" height="6" rx="3" fill="#2c3e50"/>
    <rect x="12" y="34" width="62" height="24" rx="10" fill="#1f2c3a"/>
    <rect x="30" y="66" width="62" height="34" rx="10" fill="#10a37f"/>
    <rect x="12" y="108" width="70" height="24" rx="10" fill="#1f2c3a"/>
    <rect x="36" y="140" width="56" height="24" rx="10" fill="#10a37f"/>
    <rect x="12" y="194" width="80" height="20" rx="10" fill="#1f2c3a" stroke="#10a37f" stroke-opacity="0.6"/>
  </g>

  <g font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
    <text x="48" y="78" font-size="15" font-weight="600" fill="#10a37f" letter-spacing="3">MOBILE SDK</text>
    <text x="48" y="138" font-size="44" font-weight="800" fill="#ffffff">ChatGPT for</text>
    <text x="48" y="186" font-size="44" font-weight="800" fill="#61dafb">React Native</text>
