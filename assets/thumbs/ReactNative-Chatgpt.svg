      <text x="107" y="278" text-anchor="middle" fill="#e3f2ee">React Native</text>
      <rect x="176" y="258" width="62" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#10a37f" stroke-opacity="0.55"/>
      <text x="207" y="278" text-anchor="middle" fill="#e3f2ee">Expo</text>
      <rect x="248" y="258" width="102" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#10a37f" stroke-opacity="0.55"/>
      <text x="299" y="278" text-anchor="middle" fill="#e3f2ee">TypeScript</text>
    </g>
